<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosel Wortschatz · Goethe B1 · Sentence + Grammar Tutor</title>
  <meta name="description" content="Learn German B1 vocabulary with cards, quizzes, article drills, typing practice and an AI tutor that writes reading texts and explains grammar.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%A9%F0%9F%87%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="vt-root" id="vtRoot">
  <div class="vt-header">
    <div class="vt-titlerow">
      <div>
        <div class="vt-eyebrow">Goethe-Zertifikat <em>B1</em> · Vocabulary &amp; Grammar Trainer</div>
        <h1 class="vt-title">Mosel <em>Wortschatz</em></h1>
      </div>
      <div class="vt-overall" id="vtOverall"></div>
    </div>
    <div class="vt-rail" id="vtChapters"></div>
  </div>

  <div class="vt-tabs" id="vtTabs">
    <button class="vt-tab" data-tab="search">Suche<small>Word Search</small></button>
    <button class="vt-tab" data-tab="learn">Karten<small>Cards</small></button>
    <button class="vt-tab" data-tab="artikel">Artikel<small>Articles</small></button>
    <button class="vt-tab" data-tab="quiz">Quiz<small>Test</small></button>
    <button class="vt-tab" data-tab="recall">Abruf<small>English → German</small></button>
    <button class="vt-tab" data-tab="match">Paaren<small>Match</small></button>
    <button class="vt-tab" data-tab="type">Tippen<small>Type</small></button>
    <button class="vt-tab" data-tab="builder">Sätze<small>Sentences</small></button>
    <button class="vt-tab" data-tab="read">Absatz<small>Paragraph</small></button>
    <button class="vt-tab" data-tab="stats">Fortschritt<small>Progress</small></button>
  </div>

  <div class="vt-body" id="vtBody"></div>
</div>
<footer class="mw-footer">
  <span id="dataInfo">Loading…</span>
  <span class="mw-footer-actions">
    <button type="button" id="importWords" class="mw-link">Use my own word list (JSON)</button>
    <button type="button" id="resetWords" class="mw-link" hidden>Back to the default list</button>
    <a class="mw-link" href="https://github.com/Sanojkumar21/mosel-wortschatz" target="_blank" rel="noopener">Source</a>
  </span>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</footer>
<script src="js/api.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
